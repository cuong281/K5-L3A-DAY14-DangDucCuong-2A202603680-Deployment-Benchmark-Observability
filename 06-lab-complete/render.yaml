# Render Blueprint. File nằm trong thư mục con nên khi tạo Blueprint phải nhập
# Blueprint Path: 06-lab-complete/render.yaml
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete          # dockerfilePath và dockerContext tính từ đây
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: AGENT_API_KEY
        generateValue: true           # Render tự sinh, không nằm trong Git
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue                    # Redis của Render
    name: day14-redis
    plan: free
    region: singapore                 # cùng region để dùng mạng nội bộ
    ipAllowList: []                   # chỉ cho kết nối nội bộ
    maxmemoryPolicy: noeviction       # không tự xoá dữ liệu rate limit và chi phí
