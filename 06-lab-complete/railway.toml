# Railway: chạy `railway up` trong thư mục 06-lab-complete/
# AGENT_API_KEY, REDIS_URL, ENVIRONMENT đặt trong Variables của service, không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
